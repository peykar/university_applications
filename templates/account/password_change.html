{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Change password" %} — TurkDemy{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-heading">
      <p class="eyebrow">{% trans "Account security" %}</p>
      <h1>{% trans "Change password" %}</h1>
    </div>
    <form method="post" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="button auth-email-button" type="submit">
        {% trans "Change password" %}
      </button>
    </form>
    <a class="auth-back-link" href="{% url 'sign-in-methods' %}">
      ← {% trans "Back to sign-in methods" %}
    </a>
  </div>
</section>
{% endblock %}
