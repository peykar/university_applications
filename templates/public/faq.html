{% extends "base.html" %}
{% block content %}
<h1>FAQ</h1>
{% for category in categories %}
<section>
<h2>{{ category.name_en }}</h2>
{% for faq in category.faqs.all %}
{% if faq.is_active %}
<details><summary>{{ faq.question_en }}</summary><p>{{ faq.answer_en }}</p></details>
{% endif %}
{% endfor %}
</section>
{% endfor %}
{% endblock %}
