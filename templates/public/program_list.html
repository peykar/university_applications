{% extends "base.html" %}
{% load i18n %}
{% block content %}
<h1>{% trans "Programs" %}</h1>
<form method="get"><input name="q" value="{{ request.GET.q }}" placeholder="{% trans 'Search' %}"><button>{% trans "Search" %}</button></form>
<ul>
{% for program in programs %}
<li><a href="{% url 'program-detail' program.slug_en %}">{{ program.name_en }}</a> — {{ program.university.name_en }}</li>
{% empty %}<li>{% trans "No results." %}</li>{% endfor %}
</ul>
{% endblock %}
