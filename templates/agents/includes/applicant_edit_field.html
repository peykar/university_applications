{% load i18n %}
<div class="applicant-edit-field{% if field.errors %} has-error{% endif %}{% if field.name == 'address' or field.name == 'educational_background' or field.name == 'notes' %} field-wide{% endif %}">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}
    <span>{% trans "Optional" %}</span>
  </label>
  {{ field }}
  {% if field.help_text %}
    <small class="applicant-edit-help">{{ field.help_text }}</small>
  {% endif %}
  {% if field.errors %}
    <div class="applicant-edit-errors" role="alert">
      {% for error in field.errors %}<span>{{ error }}</span>{% endfor %}
    </div>
  {% endif %}
</div>
