[project]
name = "turkdemy"
version = "0.1.0"
description = "TurkDemy Django platform"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<6",
    "django-phonenumber-field[phonenumberslite]>=8.1,<9",
    "pycountry>=24.6,<25",
    "dj-database-url>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
    "djangorestframework>=3.16,<4",
    "django-cors-headers>=4.7,<5",
    "Pillow>=11,<12",
]

[dependency-groups]
dev = [
    "black>=25.1,<26",
    "coverage>=7.6,<8",
    "pytest>=8.3,<9",
    "pytest-django>=4.10,<5",
    "ruff>=0.9,<1",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "DJ",
]
ignore = [
    "DJ001",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "turkdemy.settings"
python_files = [
    "tests.py",
    "test_*.py",
    "*_tests.py",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = [
    "apps",
    "turkdemy",
]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
