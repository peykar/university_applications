[project]
name = "turkdemy"
version = "0.1.0"
description = "University application management platform built with Django"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<5.3",
    "Pillow>=10",
    "phonenumbers>=9,<10",
    "pycountry>=24.6.1",
    "Babel>=2.15",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
