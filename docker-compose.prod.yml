services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turkdemy}
      POSTGRES_USER: ${POSTGRES_USER:-turkdemy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-turkdemy} -d ${POSTGRES_DB:-turkdemy}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command:
      [
        "uv",
        "run",
        "gunicorn",
        "turkdemy.wsgi:application",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "3",
        "--timeout",
        "60",
      ]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: turkdemy.settings.production
      DATABASE_URL: postgresql://${POSTGRES_USER:-turkdemy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-turkdemy}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
